# Default config for trl/scripts/opsft_sdft.py (OPSFT on the SDFT science task).
# Override any field on the CLI, e.g.:
#   torchrun --nproc_per_node=8 trl/scripts/opsft_sdft.py \
#       --config trl/scripts/configs/opsft_sdft.yaml \
#       --run_name "opsft science lr1e-5" --learning_rate 1e-5 --num_generations 4

# --- OPSFTConfig (trainer) ---
output_dir: checkpoints/Qwen2.5-7B-OPSFT-science
gradient_checkpointing: false   # required off for OPSFT's double-backward-free jvp
bf16: true
optim: adamw_8bit
max_completion_length: 512
num_generations: 2
per_device_train_batch_size: 1
logging_steps: 1
eval_strategy: "no"             # accuracy eval is driven by the callback, not HF's eval loop
report_to: [wandb]
learning_rate: 1.0e-5

# --- ScriptArguments (script-level) ---
model_name: Qwen/Qwen2.5-7B-Instruct
sdft_data: /home/gaetan/projects/SDFT/data
eval_every: 50
gen_batch_size: 8
science_eval_size: 64
tooluse_eval_size: null
gsm8k_eval_size: 128
science_max_new_tokens: 2048
tooluse_max_new_tokens: 2048
gsm8k_max_new_tokens: 2048
