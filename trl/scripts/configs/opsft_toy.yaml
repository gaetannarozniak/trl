# Default config for trl/scripts/opsft_toy.py (single-sample overfitting sanity check).
# Watch `ref_logp` climb toward 0. Override on the CLI, e.g.:
#   torchrun --nproc_per_node=1 trl/scripts/opsft_toy.py \
#       --config trl/scripts/configs/opsft_toy.yaml --learning_rate 1e-4 --run_name "opsft toy"

# --- OPSFTConfig (trainer) ---
output_dir: checkpoints/Qwen2.5-0.5B-OPSFT-toy
gradient_checkpointing: false
bf16: true
max_completion_length: 256
num_generations: 2
per_device_train_batch_size: 8
num_train_epochs: 20
logging_steps: 1
learning_rate: 1.0e-6           # OPSFT's F·u step scale is unusual; crank up if `ref_logp` barely moves
eval_strategy: "no"
report_to: [wandb]

# --- ScriptArguments (script-level) ---
model_name: Qwen/Qwen2.5-0.5B-Instruct
sdft_data: /home/gaetan/projects/SDFT/data
n_copies: 1000
