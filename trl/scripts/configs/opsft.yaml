# Default config for trl/scripts/opsft.py (OPSFT on GSM8K, boxed-answer accuracy reward).
# Override on the CLI, e.g.:
#   torchrun --nproc_per_node=8 trl/scripts/opsft.py \
#       --config trl/scripts/configs/opsft.yaml --run_name "opsft gsm8k" --learning_rate 1e-6

# --- OPSFTConfig (trainer) ---
output_dir: checkpoints/Qwen3-4B-OPSFT-gsm8k
gradient_checkpointing: false
bf16: true
max_completion_length: 512      # GSM8K chains of thought are long
num_generations: 8
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 50
logging_steps: 1
compute_eval_kl: true           # log eval_kl vs. the frozen base theta_0 (catastrophic-forgetting probe)
report_to: [wandb]
log_completions: true
num_completions_to_print: 1

# --- ScriptArguments (script-level) ---
model_name: Qwen/Qwen3-4B
eval_size: 64
